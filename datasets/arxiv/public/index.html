<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arXiv papers search · RawTree</title>
<link rel="icon" href="/common/favicon.ico" sizes="48x48">
<link rel="icon" href="/common/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/common/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/common/style.css">
</head>
<body>
<script>
window.APP = {
  id: 'arxiv',
  title: 'Full-text search over arXiv papers.',
  eyebrow: 'Static dataset · arXiv',
  lead: 'Search paper titles and abstracts with archive-prefix and submission-year filters.',
  placeholder: 'Search papers, e.g. graph neural networks',
  source: 'librarian-bots/arxiv-metadata-snapshot on Hugging Face',
  stats: [['papers', 'Papers']],
  api: '/api/arxiv',
  filters: [
    { name: 'field', label: 'Field', options: [['both', 'title or abstract'], ['title', 'title'], ['abstract', 'abstract']] },
    { name: 'category', label: 'Category prefix', placeholder: 'e.g. cs or cs.LG' },
    { name: 'from', label: 'From year', type: 'number', placeholder: 'from 1986' },
    { name: 'to', label: 'To year', type: 'number', placeholder: 'to 2026' },
  ],
  examples: [{ q: 'graph neural networks', category: 'cs.LG' }, { q: 'transformer', field: 'abstract' }, { q: 'dark matter', category: 'astro-ph' }],
};
</script>
<script src="/common/app.js"></script>
</body>
</html>
