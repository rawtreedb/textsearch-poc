<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wikipedia search · RawTree</title>
<link rel="stylesheet" href="/common/style.css">
</head>
<body>
<header><div class="wrap"><a class="brand" href="/">RawTree text search</a><nav><a class="pill active" href="/wikipedia/">Wikipedia</a><a class="pill" href="/stackoverflow/">Stack Overflow</a></nav></div></header>
<main class="wrap">
  <h1>Search English Wikipedia</h1>
  <p class="lead">Full-text search over 6.4M English Wikipedia articles (Nov 2023 snapshot) with the RawTree text index. Results are ranked by pageviews from a week of hourly Wikimedia pageview dumps (desktop + mobile).</p>
  <details class="query"><summary>Dataset</summary><div class="card" id="stats" style="max-width:480px"></div></details>
  <form class="search" id="form"></form>
  <div class="examples" id="examples"></div>
  <div class="tabs"><button class="pill" id="tab-results" type="button">Results</button><button class="pill" id="tab-analytics" type="button">Analytics</button></div>
  <div class="summary" id="summary"></div>
  <div id="output"></div>
</main>
<script>
window.APP = {
  api: '/api/wikipedia',
  filters: [{ name: 'field', label: 'Field', options: [['text', 'article text'], ['title', 'title'], ['both', 'title or text']] }],
  examples: [{ q: 'quantum entanglement' }, { q: 'to be or not to be', mode: 'phrase' }, { q: 'taylor swift' }, { q: 'eiffel', field: 'title' }, { q: 'überlingen' }],
};
</script>
<script src="/common/app.js"></script>
</body>
</html>
