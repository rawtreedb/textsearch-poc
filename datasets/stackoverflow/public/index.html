<!doctype html>
<html lang="en">
<head>

<title>Stack Overflow search · RawTree</title>
<link rel="icon" href="/common/favicon.ico" sizes="48x48">
<link rel="icon" href="/common/favicon.svg" type="image/svg+xml">

</head>
<body>
<script>
window.APP = {
  id: 'stackoverflow',
  title: 'Full-text search and tag analytics over every Stack Overflow post.',
  eyebrow: 'Static dataset · Stack Overflow 2008–2024',
  lead: 'About 60M questions and answers stored in RawTree as raw JSON with a text index on titles and HTML bodies, with tag, score and time analytics.',
  placeholder: 'Search posts, e.g. segmentation fault',
  source: 'Stack Exchange data dump (CC BY-SA)',
  stats: [['posts', 'Posts'], ['questions', 'Questions'], ['answers', 'Answers']],
  api: '/api/stackoverflow',
  filters: [
    { name: 'field', label: 'Field', options: [['both', 'title or body'], ['body', 'body'], ['title', 'title']] },
    { name: 'type', label: 'Post type', options: [['all', 'questions + answers'], ['questions', 'questions'], ['answers', 'answers']] },
    { name: 'sort', label: 'Sort', options: [['score', 'top score'], ['recent', 'most recent']] },
    { name: 'tag', label: 'Tag', placeholder: 'tag, e.g. rust' },
    { name: 'from', label: 'From year', type: 'number', placeholder: 'from 2008' },
    { name: 'to', label: 'To year', type: 'number', placeholder: 'to 2024' },

  modes: [['all', 'All words'], ['any', 'Any word'], ['phrase', 'Exact phrase']],
  examples: [{ q: 'borrow checker' }, { q: 'segmentation fault', tag: 'c' }, { q: 'kubernetes', type: 'questions' }],
